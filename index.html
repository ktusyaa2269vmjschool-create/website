<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Dhanya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6e6, #ffb3ba);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: absolute;
            color: rgba(255, 75, 110, 0.4);
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            bottom: -50px;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Main Card Container */
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            border: 2px solid #ff4b6e;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            color: #ff4b6e;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .heart-icon {
            font-size: 50px;
            color: #ff4b6e;
            animation: pulse 1.4s infinite;
            margin-bottom: 15px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Interactive Buttons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        .btn {
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-yes {
            background-color: #ff4b6e;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 75, 110, 0.4);
        }

        .btn-yes:hover {
            background-color: #e03859;
            transform: scale(1.05);
        }

        /* The runaway 'No' button */
        .btn-no {
            background-color: #a0a0a0;
            color: white;
            position: relative;
        }

        /* Success Message Overlay */
        .success-message {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 18px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
            animation: fadeIn 0.5s ease-in-out;
        }

        .success-message h2 {
            color: #ff4b6e;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart-icon">❤️</div>
        <h1>Hey Dhanya...</h1>
        <p>I've been holding onto a little secret for a while now. I have a massive crush on you. You make my days a whole lot brighter just by being in them. </p>
        <p><strong>Will you accept my crush , I told myself to wait until NEET because I knew how important it was to you
        
        <div class="btn-container">
            <button class="btn btn-yes" onclick="accepted()">Yes!</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveNoButton()">No</button>
        </div>

        <!-- Hidden Success Screen -->
        <div class="success-message" id="successScreen">
            <div class="heart-icon">💖🎉</div>
            <h2>Yay! ❤️</h2>
            <p> I'll text you!</p>
        </div>
    </div>

    <script>
        // Create continuous falling/floating hearts background
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; // between 3s and 6s
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            document.body.appendChild(heart);

            // Remove heart after it animation finishes
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Generate hearts constantly
        setInterval(createHeart, 300);

        // Make the "No" button run away when hovered over
        function moveNoButton() {
            const noBtn = document.getElementById('noBtn');
            // Generate random coordinates within a reasonable range
            const x = Math.random() * 150 - 75; // shifts left or right
            const y = Math.random() * 150 - 75; // shifts up or down
            
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Show success screen when "Yes" is clicked
        function accepted() {
            document.getElementById('successScreen').style.display = 'flex';
            
            // Trigger extra frantic celebration hearts
            for(let i=0; i<50; i++) {
                setTimeout(createHeart, i * 50);
            }
        }
    </script>
</body>
</html>
